replicaCount: 1

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

nameOverride: ""
fullnameOverride: ""

image:
  repository: docker.io/jaegertracing/jaeger
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

service:
  type: ClusterIP
  annotations: {}

clickhouse:
  # Remote ClickHouse host (no scheme, just the hostname).
  host: "128.0.0.1"
  # Remote ClickHouse port.
  port: 8123
  # ClickHouse database name.
  database: jaeger

  # ClickHouse wire protocol Jaeger uses to connect. One of "http" or "native".
  # "http" talks HTTP(S) to clickhouse.port (typically 8123/8443).
  # "native" talks the ClickHouse native TCP protocol (typically 9000/9440),
  # which is more efficient but requires clickhouse.port to point at the
  # native port instead.
  protocol: "http"

  # Set to true when ClickHouse is exposed over TLS (HTTPS for "http",
  # TLS-wrapped native for "native"). Jaeger connects to ClickHouse directly
  # over TLS using its native ClickHouse exporter support — no sidecar
  # involved.
  tls: false

  # Skip TLS certificate verification. Only use for self-signed/internal
  # certs — full verification against the system trust store is strongly
  # preferred. Ignored when clickhouse.tls is false.
  tlsInsecureSkipVerify: false

  # Credentials — choose one of the two options below:
  #
  # Option A — plain values (recommended for Qovery).
  # The chart will create a Secret from these values.
  # On Qovery, use the qovery.env.* macro in your values override:
  #   clickhouse:
  #     username: "qovery.env.CLICKHOUSE_USERNAME"
  #     password: "qovery.env.CLICKHOUSE_PASSWORD"
  username: ""
  password: ""

  # Option B — reference a pre-existing Kubernetes Secret.
  # The Secret must have keys "username" and "password".
  # When set, takes precedence over username/password above.
  existingSecret: ""

# ── Jaeger / OTel Collector configuration ────────────────────────────────────
#
# The chart generates the full Jaeger config from the values above (clickhouse.*
# etc.).  Use extraConfig to override any generated key or to inject additional
# OTel extensions / processors / exporters.
#
# extraConfig is deep-merged on top of the generated config, so any key set
# here takes precedence.
#
# Example — lower the log level and add a batch processor:
#   extraConfig:
#     service:
#       telemetry:
#         logs:
#           level: debug
#     processors:
#       batch: {}
#     service:
#       pipelines:
#         traces:
#           processors:
#             - batch
extraConfig: {}
